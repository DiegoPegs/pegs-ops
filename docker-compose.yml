services:
  postgres:
    image: postgres:16-alpine
    container_name: pegs-ops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pegs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pegs}
      POSTGRES_DB: ${POSTGRES_DB:-pegs_ops}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pegs} -d ${POSTGRES_DB:-pegs_ops}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
